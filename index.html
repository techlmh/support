<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>지원장학 요청서 분석 및 부서 분류 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css" />
    <style>
      body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; background-color: #f8f9fa; }
      #loading { text-align: center; color: #495057; }
      .spinner { border: 4px solid #dee2e6; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #root { width: 100%; height: 100%; display: none; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <h2>데이터 분석 환경을 불러오는 중입니다...</h2>
      <p>첫 접속 시 약 10~20초 정도 소요됩니다.</p>
    </div>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
      // '?v=' + new Date().getTime() 를 추가하여 강력 새로고침 없이도 항상 최신 파이썬 코드를 불러옵니다.
      fetch('app.py?v=' + new Date().getTime())
        .then(response => response.text())
        .then(pythonCode => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("root").style.display = "block";
          
          stlite.mount({
            requirements: ["pandas", "openpyxl", "xlrd"],
            entrypoint: "app.py",
            files: {
              "app.py": pythonCode
            }
          }, document.getElementById("root"));
        })
        .catch(error => {
          document.getElementById("loading").innerHTML = "<h3>app.py 파일을 불러오는 데 실패했습니다.</h3><p>GitHub 저장소에 app.py 파일이 있는지 확인해주세요.</p>";
          console.error("Error loading app.py:", error);
        });
    </script>
  </body>
</html>
